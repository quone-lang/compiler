name: release

on:
  push:
    tags:
      - 'v*'

# Asset names follow `RELEASING.md`:
#   quonec-<os>-<arch>.tar.gz
# os in {macos, linux}, arch in {x86_64, arm64}.
permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target.os }}-${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - {os: macos,   arch: x86_64, runner: macos-13,      ext: ''}
          - {os: macos,   arch: arm64,  runner: macos-latest,  ext: ''}
          - {os: linux,   arch: x86_64, runner: ubuntu-latest, ext: ''}
          - {os: linux,   arch: arm64,  runner: ubuntu-22.04-arm, ext: ''}
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.12.2'
          cabal-version: 'latest'

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-${{ matrix.target.arch }}-release-${{ hashFiles('**/compiler.cabal', '**/cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target.arch }}-release-

      - name: cabal update
        run: cabal update

      - name: Stage and package
        shell: bash
        run: |
          set -e
          asset="quonec-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz"
          stage="$(mktemp -d)"
          cabal install exe:quonec \
            --installdir="$stage" \
            --overwrite-policy=always \
            --install-method=copy \
            --enable-executable-stripping \
            -O2
          test -x "$stage/quonec"
          tar -czf "$asset" -C "$stage" "quonec"
          ls -la "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quonec-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: |
            quonec-*.tar.gz
            quonec-*.tar.gz.sha256

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package
          cp dist/quone-vscode.vsix ../../quone-vscode.vsix

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release artifacts
        run: ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/quonec-*.tar.gz
            dist/quonec-*.tar.gz.sha256
            quone-vscode.vsix
