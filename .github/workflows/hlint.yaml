name: hlint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up HLint
        uses: haskell-actions/hlint-setup@v2
        with:
          version: '3.10'

      - name: Run HLint
        uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "app/", "tests/"]'
          fail-on: warning
