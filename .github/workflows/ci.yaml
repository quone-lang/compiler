name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ghc: ['9.6.6', '9.8.4', '9.10.1', '9.12.2']
        exclude:
          # Skip the older two GHCs on Windows to keep the matrix tractable;
          # we only need one Windows row to catch portability bugs.
          - os: windows-latest
            ghc: '9.6.6'
          - os: windows-latest
            ghc: '9.8.4'
          - os: windows-latest
            ghc: '9.10.1'
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 'latest'

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc${{ matrix.ghc }}-cabal-${{ hashFiles('**/compiler.cabal', '**/cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-ghc${{ matrix.ghc }}-cabal-

      - name: cabal update
        run: cabal update

      - name: cabal build
        run: cabal build all

      - name: cabal test
        run: cabal test --test-show-details=direct

      - name: release example check
        run: cabal exec quonec -- check examples/hello.Q
